 
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAMIL JOBS</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f1f5f9;color:#222}
header{background:#075e45;color:white;padding:22px;text-align:center}
header h2{margin:0 0 8px}
.stats{display:flex;justify-content:space-around;background:white;padding:15px;text-align:center}
.stats b{display:block;font-size:23px;color:#087451}
.search{padding:15px}
input,select{width:100%;padding:13px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:15px}
.tabs{display:flex;gap:8px;padding:10px}
.tabs button{flex:1;padding:12px;border:0;border-radius:8px;background:#ddd;font-weight:bold}
.tabs button.active{background:#075e45;color:white}
#jobs{padding:12px}
.job{background:white;padding:16px;margin-bottom:12px;border-radius:12px;box-shadow:0 2px 6px #ddd}
.job h3{color:#075e45;margin-top:0}
.job p{margin:7px 0;font-size:14px}
.apply{display:block;background:#087451;color:white;text-align:center;padding:12px;border-radius:8px;text-decoration:none;font-weight:bold;margin-top:12px}
.save{border:0;background:#fff3cd;padding:9px;border-radius:7px;margin-top:8px}
footer{text-align:center;padding:20px;color:#555}
</style>
</head>
<body>
<header>
<h2>💼 தமிழ் வேலைவாய்ப்பு</h2>
TAMIL JOBS – உங்கள் வேலை உங்கள் கையில்!
</header>

<div class="stats">
<div><b id="total">0</b>வேலைகள்</div>
<div><b id="vacancies">0</b>காலியிடங்கள்</div>
<div><b id="saved">0</b>சேமித்தவை</div>
</div>

<div class="search">
<input id="search" placeholder="🔍 வேலை அல்லது நிறுவனம் தேடுங்கள்...">
<select id="district">
<option value="">அனைத்து மாவட்டங்களும்</option>
<option>ஈரோடு</option><option>சென்னை</option>
<option>கோயம்புத்தூர்</option><option>மதுரை</option>
<option>திருச்சி</option><option>சேலம்</option>
</select>
</div>

<div class="tabs">
<button class="active" onclick="setType('அனைத்தும்',this)">அனைத்தும்</button>
<button onclick="setType('அரசு',this)">அரசு</button>
<button onclick="setType('தனியார்',this)">தனியார்</button>
</div>

<div id="jobs">வேலைகள் ஏற்றப்படுகின்றன...</div>

<footer>
📌 அதிகாரப்பூர்வ வேலைவாய்ப்பு இணையதளங்கள்
<p><a href="https://www.tnpsc.gov.in/">TNPSC</a></p>
<p><a href="https://www.ncs.gov.in/">National Career Service</a></p>
<p><a href="https://employmentexchange.tn.gov.in/">தமிழ்நாடு வேலைவாய்ப்புத் துறை</a></p>
© 2026 TAMIL JOBS
</footer>

<script>
let allJobs=[];
let currentType='அனைத்தும்';
let saved=JSON.parse(localStorage.getItem('savedJobs')||'[]');

async function loadJobs(){
try{
const response=await fetch('jobs.json?t='+Date.now());
if(!response.ok) throw new Error('File error');
const data=await response.json();

allJobs=data.filter(j=>
j.verified===true &&
j.status==='open' &&
j.title &&
j.applyUrl &&
j.applyUrl.startsWith('https://')
);

showJobs();
}catch(e){
document.getElementById('jobs').innerHTML=
'வேலைப் பட்டியலைப் பெற முடியவில்லை. பின்னர் முயற்சிக்கவும்.';
}
}

function setType(type,btn){
currentType=type;
document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
showJobs();
}

function showJobs(){
let q=document.getElementById('search').value.toLowerCase();
let d=document.getElementById('district').value;

let list=allJobs.filter(j=>{
let match=(j.title+' '+j.company+' '+j.department).toLowerCase().includes(q);
let type=currentType==='அனைத்தும்'||j.type===currentType;
let district=!d||j.district===d||j.district==='அனைத்து மாவட்டங்களும்';
return match&&type&&district;
});

document.getElementById('total').textContent=allJobs.length;
document.getElementById('vacancies').textContent=
allJobs.reduce((n,j)=>n+(Number(j.vacancies)||0),0);
document.getElementById('saved').textContent=saved.length;

document.getElementById('jobs').innerHTML=list.length?list.map(j=>`
<div class="job">
<h3>${safe(j.title)}</h3>
<p>🏢 நிறுவனம்: ${safe(j.company)}</p>
<p>📍 மாவட்டம்: ${safe(j.district)}</p>
<p>🎓 கல்வித்தகுதி: ${safe(j.qualification)}</p>
<p>👥 காலியிடங்கள்: ${safe(j.vacancies)}</p>
<p>💰 சம்பளம்: ${safe(j.salary)}</p>
<p>💳 கட்டணம்: ${safe(j.fee)}</p>
<p>📅 கடைசி தேதி: ${safe(j.lastDate)}</p>
<p>${safe(j.description||'')}</p>
<a class="apply" href="${safe(j.applyUrl)}" target="_blank" rel="noopener">APPLY NOW ➜</a>
<button class="save" onclick="toggleSave(${Number(j.id)})">
${saved.includes(Number(j.id))?'❤️ சேமிக்கப்பட்டது':'🤍 சேமிக்கவும்'}
</button>
</div>`).join(''):
'<p style="text-align:center;padding:30px">தற்போது சரிபார்க்கப்பட்ட வேலைகள் எதுவும் இல்லை.</p>';
}

function safe(value){
return String(value??'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
}

function toggleSave(id){
saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];
localStorage.setItem('savedJobs',JSON.stringify(saved));
showJobs();
}

document.getElementById('search').addEventListener('input',showJobs);
document.getElementById('district').addEventListener('change',showJobs);

loadJobs();
setInterval(loadJobs,30*60*1000);
</script>
</body>
</html>
