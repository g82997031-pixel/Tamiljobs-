
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAMIL JOBS</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#222}
header{background:#075e45;color:white;padding:22px;text-align:center}
header h1{margin:0}
header p{margin:8px 0 0}
.search{padding:15px}
input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:8px;font-size:16px;margin-bottom:10px}
.tabs{display:flex;gap:8px;padding:0 12px}
.tabs button{flex:1;padding:12px;border:0;border-radius:8px;background:#ddd}
.tabs button.active{background:#087b53;color:white}
.jobs{padding:12px}
.job{background:white;padding:16px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 7px #ddd}
.job h3{color:#075e45;margin:0 0 10px}
.job p{margin:6px 0}
.apply{display:inline-block;background:#087b53;color:white;padding:10px 18px;border-radius:7px;text-decoration:none;margin-top:8px}
footer{text-align:center;padding:20px;background:#075e45;color:white}
</style>
</head>
<body>
<header>
<h1>தமிழ் வேலைவாய்ப்பு</h1>
<p>TAMIL JOBS – உங்கள் வேலை உங்கள் கையில்!</p>
</header>

<div class="search">
<input id="search" placeholder="வேலையைத் தேடுங்கள்..." oninput="showJobs()">
<select id="district" onchange="showJobs()">
<option value="">அனைத்து மாவட்டங்களும்</option>
<option>சென்னை</option><option>கோயம்புத்தூர்</option>
<option>ஈரோடு</option><option>மதுரை</option>
<option>திருச்சி</option><option>சேலம்</option>
</select>
</div>

<div class="tabs">
<button class="active" onclick="setType('அனைத்தும்',this)">அனைத்தும்</button>
<button onclick="setType('அரசு',this)">அரசு வேலை</button>
<button onclick="setType('தனியார்',this)">தனியார்</button>
</div>

<div class="jobs" id="jobs"></div>

<footer>
<p>© 2026 TAMIL JOBS</p>
<p>வேலைவாய்ப்பு தகவல்களுக்காக எங்களுடன் இணைந்திருங்கள்!</p>
</footer>

<script>
const data=[
{title:"அலுவலக உதவியாளர்",type:"அரசு",district:"ஈரோடு",edu:"10ஆம் வகுப்பு",url:"https://www.tnpsc.gov.in/"},
{title:"கணினி ஆபரேட்டர்",type:"தனியார்",district:"கோயம்புத்தூர்",edu:"12ஆம் வகுப்பு",url:"https://www.ncs.gov.in/"},
{title:"Junior Assistant",type:"அரசு",district:"சென்னை",edu:"பட்டப்படிப்பு",url:"https://www.tnpsc.gov.in/"},
{title:"Data Entry Operator",type:"தனியார்",district:"ஈரோடு",edu:"12ஆம் வகுப்பு",url:"https://www.ncs.gov.in/"}
];
let current="அனைத்தும்";
function setType(type,btn){
current=type;
document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
showJobs();
}
function showJobs(){
let s=document.getElementById("search").value.toLowerCase();
let d=document.getElementById("district").value;
let list=data.filter(j=>(current==="அனைத்தும்"||j.type===current)&&(!d||j.district===d)&&(j.title.toLowerCase().includes(s)||j.district.includes(s)));
document.getElementById("jobs").innerHTML=list.length?list.map(j=>`
<div class="job">
<h3>${j.title}</h3>
<p>வகை: ${j.type}</p>
<p>மாவட்டம்: ${j.district}</p>
<p>கல்வித்தகுதி: ${j.edu}</p>
<a class="apply" href="${j.url}" target="_blank">விண்ணப்பிக்கவும்</a>
</div>`).join(""):"வேலைகள் எதுவும் இல்லை";
}
showJobs();
</script>
</body>
</html>
